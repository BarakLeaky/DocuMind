services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 5s
      retries: 10

  # Optional: run the whole stack in containers (`docker compose --profile app up --build`).
  app:
    profiles: ["app"]
    build: .
    env_file: [.env.local]
    environment:
      DATABASE_URL: postgres://documind:documind@db:5432/documind
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build: { context: ., dockerfile: Dockerfile.worker }
    env_file: [.env.local]
    environment:
      DATABASE_URL: postgres://documind:documind@db:5432/documind
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
